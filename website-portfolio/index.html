<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Portfolio of Jesse Wainaina — selected work in design, motion, and brand.">
    <title>Portfolio | Jesse Wainaina</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="masthead">
        <div class="container">
            <a href="#" class="wordmark">Jesse Wainaina</a>
            <nav class="nav">
                <a href="#work">Work</a>
                <a href="#about">About</a>
                <a href="#contact">Contact</a>
            </nav>
        </div>
    </header>

    <main>
        <!-- Intro -->
        <section class="intro">
            <div class="container">
                <h1 class="intro-title">Selected work,<br>built to be seen.</h1>
                <p class="intro-lead">A portfolio in progress. Replace this copy with your own positioning statement.</p>
            </div>
        </section>

        <!-- Work -->
        <section class="section" id="work">
            <div class="container">
                <h2 class="section-title">Work</h2>
                <ul class="work-grid" id="work-grid">
                    <!-- Cards are rendered from the `projects` array in script.js -->
                </ul>
            </div>
        </section>

        <!-- About -->
        <section class="section" id="about">
            <div class="container">
                <h2 class="section-title">About</h2>
                <p class="prose">Short bio goes here — who you are, what you make, and who you make it for.</p>
            </div>
        </section>

        <!-- Contact -->
        <section class="section" id="contact">
            <div class="container">
                <h2 class="section-title">Contact</h2>
                <p class="prose">
                    <a href="mailto:hello@example.com" class="link">hello@example.com</a>
                </p>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="container">
            <span>&copy; <span id="year"></span> Jesse Wainaina</span>
        </div>
    </footer>

    <script src="script.js"></script>
</body>
</html>
