<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A case study from Control Tee, a Nairobi-based creative studio working in motion design, brand identity, and video production.">
    <link rel="icon" type="image/png" href="assets/logo.png">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Control Tee">
    <meta property="og:title" content="Project — Control Tee">
    <meta property="og:description" content="A case study from Control Tee.">
    <meta property="og:image" content="assets/logo.png">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Project — Control Tee">
    <meta name="twitter:description" content="A case study from Control Tee.">
    <meta name="twitter:image" content="assets/logo.png">
    <title>Project — Control Tee</title>
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@100,200,300,400,500,600,700,800,900&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300;1,9..40,400&display=swap">
    <link rel="stylesheet" href="style.css">
</head>
<body class="page-transition">

    <nav class="sticky-back-nav">
        <a href="javascript:history.back()" class="btn">← Back</a>
    </nav>

    <main class="container" style="padding-bottom: 120px; padding-top: 100px;">
        
        <!-- 1. Project Banner / Cover -->
        <div id="project-media" class="reveal" style="width: 100%; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); margin-bottom: 40px;">
            <div class="empty-state" style="padding: 100px;">Loading Project...</div>
        </div>

        <!-- 2. Horizontal Folder Info Row -->
        <div class="reveal" id="project-meta" style="opacity: 0; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 40px; margin-bottom: 60px; border-bottom: 1px solid var(--border); padding-bottom: 60px;">
            <div style="flex: 1; min-width: 300px;">
                <h1 id="project-title" style="font-family: 'Cabinet Grotesk', sans-serif; font-size: clamp(2rem, 4vw, 3.5rem); color: var(--yellow); text-transform: uppercase; margin-bottom: 16px; line-height: 1;">Loading...</h1>
                <p id="project-desc" style="font-family: 'DM Sans', sans-serif; font-size: 1.05rem; font-weight: 300; color: rgba(255,255,255,0.65); line-height: 1.7; max-width: 600px;"></p>
            </div>
            <div style="display: flex; flex-wrap: wrap; gap: 40px; text-align: left; align-items: flex-start;">
                <div>
                    <span style="display: block; font-family: 'DM Sans', sans-serif; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 3px; color: rgba(255,255,255,0.4); margin-bottom: 8px;">Client</span>
                    <strong id="meta-client" style="font-family: 'Cabinet Grotesk', sans-serif; font-size: 1.2rem; font-weight: 700;">—</strong>
                </div>
                <div>
                    <span style="display: block; font-family: 'DM Sans', sans-serif; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 3px; color: rgba(255,255,255,0.4); margin-bottom: 8px;">Date Made</span>
                    <strong id="meta-date" style="font-family: 'Cabinet Grotesk', sans-serif; font-size: 1.2rem; font-weight: 700;">—</strong>
                </div>
                <div>
                    <span style="display: block; font-family: 'DM Sans', sans-serif; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 3px; color: rgba(255,255,255,0.4); margin-bottom: 8px;">Category</span>
                    <strong id="meta-category" style="font-family: 'Cabinet Grotesk', sans-serif; font-size: 1.2rem; font-weight: 700;">—</strong>
                </div>
            </div>
        </div>
        
        <!-- Additional Gallery Marquee -->
        <div id="project-gallery-container" class="poster-marquee-container" style="display:none; padding-top:60px;">
            <div class="poster-marquee" id="gallery-track"></div>
        </div>
    </main>

    <footer class="main-footer container">
        <div class="social-links">
            <a href="https://www.instagram.com/control.tee/" target="_blank" rel="noopener">Instagram</a>
            <a href="https://www.behance.net/controltee" target="_blank" rel="noopener">Behance</a>
            <a href="https://www.linkedin.com/in/controltee/" target="_blank" rel="noopener">LinkedIn</a>
        </div>
        <a href="contact.html" class="btn">Work With Us</a>
        <div class="footer-legal">
            <a href="privacy.html">Privacy Policy</a>
            <a href="terms.html">Terms of Service</a>
            <a href="copyright.html">Copyright &amp; Client Work</a>
        </div>
        <p class="footer-copy">&copy; 2026 Control Tee</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.5/dist/umd/supabase.js" integrity="sha384-fTq5g8tD1IgcQKSKKNu5HdZncuhKN6e5MmGdzPNCK4jk3lh0tfnPZAtrUvyvgt4i" crossorigin="anonymous"></script>
    <script src="db.js"></script>
    <script>
        const supabase = window.db;

        async function loadProject() {
            try {
                if (!supabase) throw new Error("Database file failed to initialize properly.");
                
                const params = new URLSearchParams(window.location.search);
                const id = params.get('id');
                if (!id) {
                    document.getElementById('project-title').textContent = 'Project Not Found';
                    document.getElementById('project-media').innerHTML = '<div class="empty-state">Invalid URL.</div>';
                    return;
                }

                const { data: project, error } = await supabase
                    .from('projects')
                    .select('*, categories(name), clients(name)')
                    .eq('id', id)
                    .single();

                if (error || !project) {
                    document.getElementById('project-title').textContent = 'Project Error';
                    document.getElementById('project-media').innerHTML = `<div class="empty-state">Error: ${error?.message || 'Media not found.'}</div>`;
                    return;
                }

                const titleEl = document.getElementById('project-title');
                titleEl.textContent = project.title;
                if (window.scrambleText) window.scrambleText(titleEl);

                document.title = project.title + ' — Control Tee';
                document.getElementById('project-desc').innerHTML = project.description ? escapeHtml(project.description).replace(/\n/g, '<br>') : '';
                document.getElementById('meta-client').textContent = project.clients ? project.clients.name : 'Independent';
                document.getElementById('meta-category').textContent = project.categories ? project.categories.name : 'Uncategorized';
                document.getElementById('meta-date').textContent = project.date_made || new Date(project.created_at).getFullYear();
                document.getElementById('project-meta').style.opacity = '1';

                const isVideo = project.cover_url && project.cover_url.match(/\.(mp4|webm)$/i);
                const safeTitle = escapeHtml(project.title);
                const safeCoverUrl = escapeHtml(project.cover_url);
                document.getElementById('project-media').innerHTML = isVideo
                    ? `<video src="${safeCoverUrl}" autoplay muted loop playsinline style="width:100%; max-height: 85vh; object-fit:cover; display:block;"></video>`
                    : `<img src="${safeCoverUrl}" style="width:100%; max-height: 85vh; object-fit:cover; display:block;" alt="${safeTitle}">`;

                // Load Additional Gallery Images
                const { data: mediaFiles, error: mediaErr } = await supabase.from('project_media').select('media_url').eq('project_id', id);
                if (mediaErr) {
                    console.error("Gallery Load Error:", mediaErr.message);
                } else if (mediaFiles && mediaFiles.length > 0) {
                    const track = document.getElementById('gallery-track');
                    let html = mediaFiles.map(m => `<img src="${escapeHtml(m.media_url)}" alt="${safeTitle} Gallery" class="poster-item" loading="lazy">`).join('');
                    track.innerHTML = html + html;
                    document.getElementById('project-gallery-container').style.display = 'block';
                }
            } catch (err) {
                console.error(err);
                document.getElementById('project-title').textContent = 'System Error';
                document.getElementById('project-media').innerHTML = `<div class="empty-state">JS Exception: ${err.message}</div>`;
            }
        }
        loadProject();
    </script>
    <script src="animations.js"></script>
</body>
</html>
