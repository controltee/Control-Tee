<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Page not found — Control Tee.">
    <meta name="robots" content="noindex, follow">
    <link rel="icon" type="image/png" href="assets/logo.png">
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@100,200,300,400,500,600,700,800,900&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300;1,9..40,400&display=swap">
    <link rel="stylesheet" href="style.css">
    <title>Page Not Found — Control Tee</title>
    <style>
        .notfound-section {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 20px;
        }
        .notfound-folder {
            width: 120px;
            height: 86px;
            background: rgba(255,255,255,0.04);
            border: 3px solid var(--border);
            border-radius: 4px 8px 8px 8px;
            position: relative;
            margin: 0 auto 36px;
        }
        .notfound-folder::before {
            content: '';
            position: absolute;
            top: -15px; left: -3px;
            width: 46px; height: 15px;
            background: rgba(255,255,255,0.04);
            border: 3px solid var(--border);
            border-bottom: none;
            border-radius: 6px 6px 0 0;
        }
        .notfound-folder::after {
            content: '?';
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Cabinet Grotesk', sans-serif;
            font-weight: 900;
            font-size: 2rem;
            color: var(--yellow);
        }
        .notfound-code {
            font-family: 'Cabinet Grotesk', sans-serif;
            font-weight: 900;
            font-size: clamp(3.5rem, 12vw, 7rem);
            letter-spacing: -4px;
            line-height: 1;
            color: var(--yellow);
            margin-bottom: 8px;
        }
        .notfound-title {
            font-family: 'Cabinet Grotesk', sans-serif;
            font-weight: 700;
            font-size: clamp(1.3rem, 3vw, 1.8rem);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 16px;
        }
        .notfound-body {
            font-family: 'DM Sans', sans-serif;
            font-weight: 300;
            font-size: 1rem;
            color: rgba(255,255,255,0.6);
            max-width: 420px;
            margin: 0 auto 8px;
            line-height: 1.7;
        }
    </style>
</head>
<body class="page-transition">

    <nav class="sticky-back-nav">
        <a href="index.html" class="btn">← Back</a>
    </nav>

    <section class="notfound-section">
        <div class="container">
            <div class="notfound-folder"></div>
            <p class="notfound-code" data-scramble>404</p>
            <h1 class="notfound-title">Folder Not Found</h1>
            <p class="notfound-body">The page you're looking for doesn't exist, or it's moved. Double-check the link, or head back and browse the work from there.</p>
            <a href="index.html" class="btn" style="margin-top: 32px;">Back to Home</a>
        </div>
    </section>

    <footer class="main-footer container">
        <div class="social-links">
            <a href="https://www.instagram.com/control.tee/" target="_blank" rel="noopener">Instagram</a>
            <a href="https://www.behance.net/controltee" target="_blank" rel="noopener">Behance</a>
            <a href="https://www.linkedin.com/in/controltee/" target="_blank" rel="noopener">LinkedIn</a>
        </div>
        <div class="footer-legal">
            <a href="privacy.html">Privacy Policy</a>
            <a href="terms.html">Terms of Service</a>
            <a href="copyright.html">Copyright &amp; Client Work</a>
        </div>
        <p class="footer-copy">&copy; 2026 Control Tee</p>
    </footer>

    <script src="animations.js"></script>
</body>
</html>
