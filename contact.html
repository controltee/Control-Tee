<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Get in touch with Control Tee.">
    <link rel="icon" type="image/png" href="assets/logo.png">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Control Tee">
    <meta property="og:title" content="Contact — Control Tee">
    <meta property="og:description" content="Get in touch with Control Tee, a Nairobi-based creative studio.">
    <meta property="og:image" content="assets/logo.png">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Contact — Control Tee">
    <meta name="twitter:description" content="Get in touch with Control Tee, a Nairobi-based creative studio.">
    <meta name="twitter:image" content="assets/logo.png">
    <title>Contact — Control Tee</title>
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin>
    <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@100,200,300,400,500,600,700,800,900&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300;1,9..40,400&display=swap">
    <link rel="stylesheet" href="style.css">
</head>
<body class="page-transition">

    <nav class="sticky-back-nav">
        <a href="index.html" class="btn">← Back</a>
    </nav>

    <section class="contact-section">
        <div class="contact-grid container">
            <div>
                <h1 class="contact-headline" data-scramble>Let's Work.</h1>
                <p class="contact-body" id="contact-body">Control Tee is a creative studio built for bold brands.</p>
            </div>

            <div id="form-container">
                <form class="contact-form" id="custom-contact-form">
                    <input type="hidden" name="access_key" value="11d96307-207d-4c24-9378-dea299083f92">
                    <input type="checkbox" name="botcheck" class="hidden" style="display: none;">

                    <div class="form-group">
                        <label class="form-label" for="name">Name</label>
                        <input class="form-input" type="text" id="name" name="name" placeholder="Your name" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="email">Email</label>
                        <input class="form-input" type="email" id="email" name="email" placeholder="your@email.com" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="project">Project type</label>
                        <input class="form-input" type="text" id="project" name="project" placeholder="Brand Identity, Motion...">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="message">Message</label>
                        <textarea class="form-textarea" id="message" name="message" placeholder="Tell us about your project…" required></textarea>
                    </div>
                    
                    <div class="h-captcha" data-captcha="true" style="margin-top: 10px;"></div>

                    <button type="submit" id="submit-btn" class="btn form-submit" style="margin-top: 20px;">Send It</button>
                    <p id="form-error-msg" style="color: #ff6b6b; font-size: 0.85rem; margin-top: 12px; display: none;"></p>
                </form>

                <div id="success-message" style="display: none; text-align: left; padding: 40px; border: 1px dashed var(--border); border-radius: 4px; background: rgba(247,213,79,0.03);">
                    <h3 style="font-family: 'Cabinet Grotesk', sans-serif; font-size: 2rem; color: var(--yellow); margin-bottom: 12px;">Message Sent</h3>
                    <p style="font-family: 'DM Sans', sans-serif; color: rgba(255,255,255,0.6);">Thank you for reaching out. We will get back to you shortly.</p>
                </div>
            </div>
        </div>
    </section>

    <footer class="main-footer container">
        <div class="social-links">
            <a href="https://www.instagram.com/control.tee/" target="_blank" rel="noopener">Instagram</a>
            <a href="https://www.behance.net/controltee" target="_blank" rel="noopener">Behance</a>
            <a href="https://www.linkedin.com/in/controltee/" target="_blank" rel="noopener">LinkedIn</a>
        </div>
        <div class="footer-legal">
            <a href="privacy.html">Privacy Policy</a>
            <a href="terms.html">Terms of Service</a>
            <a href="copyright.html">Copyright &amp; Client Work</a>
        </div>
        <p class="footer-copy">&copy; 2026 Control Tee</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="db.js"></script>
    <script src="https://web3forms.com/client/script.js" async defer></script>
    
    <script>
        const supabase = window.db;
        const contactForm = document.getElementById('custom-contact-form');
        const submitBtn = document.getElementById('submit-btn');
        const errorMsg = document.getElementById('form-error-msg');
        const successUi = document.getElementById('success-message');
        
        contactForm.addEventListener('submit', function(e) {
            e.preventDefault(); 
            submitBtn.textContent = 'Sending...';
            submitBtn.disabled = true;
            errorMsg.style.display = 'none';

            fetch('https://api.web3forms.com/submit', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
                body: JSON.stringify(Object.fromEntries(new FormData(contactForm)))
            })
            .then(async (res) => {
                let json = await res.json();
                if (res.status === 200) {
                    contactForm.style.display = 'none';
                    successUi.style.display = 'block';
                } else {
                    errorMsg.textContent = json.message;
                    errorMsg.style.display = 'block';
                    submitBtn.textContent = 'Send It';
                    submitBtn.disabled = false;
                    if (window.hcaptcha) hcaptcha.reset();
                }
            })
            .catch(() => {
                errorMsg.textContent = 'Network error. Please try again.';
                errorMsg.style.display = 'block';
                submitBtn.disabled = false;
            });
        });
    </script>
    <script src="animations.js"></script>
</body>
</html>
