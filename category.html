<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Category — Control Tee</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="page-transition">

    <nav class="sticky-back-nav">
        <a href="index.html#work" class="btn">← Back</a>
    </nav>

    <header class="project-header">
        <div class="container">
            <h1 id="category-title">Loading...</h1>
            <p id="category-desc"></p>
        </div>
    </header>

    <main class="container" style="padding-bottom: 100px;">
        <div id="projects-grid" class="portfolio-grid portfolio-grid--projects">
            <div class="empty-state" style="grid-column: 1/-1;">Loading projects...</div>
        </div>
    </main>

    <footer class="main-footer container">
        <div class="social-links">
            <a href="https://www.instagram.com/control.tee/" target="_blank" rel="noopener">Instagram</a>
            <a href="https://www.behance.net/controltee" target="_blank" rel="noopener">Behance</a>
            <a href="https://www.linkedin.com/in/controltee/" target="_blank" rel="noopener">LinkedIn</a>
        </div>
        <a href="contact.html" class="btn">Work With Us</a>
        <p class="footer-copy">&copy; 2026 Control Tee</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="db.js"></script>
    <script>
        const supabase = window.db;

        async function loadCategory() {
            try {
                if (!supabase) throw new Error("Database file failed to initialize properly.");
                
                const params = new URLSearchParams(window.location.search);
                const slug = params.get('id');
                
                if (!slug) {
                    document.getElementById('category-title').textContent = 'Category Not Found';
                    document.getElementById('projects-grid').innerHTML = '';
                    return;
                }

                // 1. Fetch category info
                const { data: category, error: catError } = await supabase
                    .from('categories')
                    .select('*')
                    .eq('slug', slug)
                    .single();

                if (catError || !category) {
                    document.getElementById('category-title').textContent = 'Category Error';
                    document.getElementById('projects-grid').innerHTML = `<div class="empty-state" style="grid-column: 1/-1;">Error: ${catError?.message || 'Category not found.'}</div>`;
                    return;
                }

                const titleEl = document.getElementById('category-title');
                titleEl.textContent = category.name;
                if (window.scrambleText) window.scrambleText(titleEl);

                document.title = category.name + ' — Control Tee';
                document.getElementById('category-desc').textContent = category.description || '';

                // 2. Fetch projects for this category
                const { data: projects, error: projError } = await supabase
                    .from('projects')
                    .select('*, clients(name)')
                    .eq('category_id', category.id)
                    .order('sort_order', { ascending: true })
                    .order('created_at', { ascending: false });

                const grid = document.getElementById('projects-grid');
                if (projError) {
                    grid.innerHTML = `<div class="empty-state" style="grid-column: 1/-1;">Database Error: ${projError.message}</div>`;
                    return;
                } else if (!projects || projects.length === 0) {
                    grid.innerHTML = '<div class="empty-state" style="grid-column: 1/-1;">No projects found in this category yet.</div>';
                    return;
                }

                grid.innerHTML = projects.map(p => {
                    const isVideo = p.cover_url && p.cover_url.match(/\.(mp4|webm)$/i);
                    const title = escapeHtml(p.title);
                    const coverUrl = escapeHtml(p.cover_url);
                    const mediaHtml = isVideo
                        ? `<video src="${coverUrl}" autoplay muted loop playsinline style="width:100%;height:100%;object-fit:cover;display:block;"></video>`
                        : `<img src="${coverUrl}" alt="${title}" loading="lazy">`;

                    return `
                        <a href="project.html?id=${encodeURIComponent(p.id)}" class="project-card reveal is-visible">
                            ${mediaHtml}
                            <div class="project-card-info">
                                <p class="project-card-cat">${escapeHtml(category.name)} · ${escapeHtml(p.clients ? p.clients.name : 'Independent')}</p>
                                <h3 class="project-card-title">${title}</h3>
                            </div>
                        </a>
                    `;
                }).join('');
            } catch (err) {
                console.error(err);
                document.getElementById('category-title').textContent = 'System Error';
                document.getElementById('projects-grid').innerHTML = `<div class="empty-state" style="grid-column: 1/-1;">JS Exception: ${err.message}</div>`;
            }
        }

        loadCategory();
    </script>
    <script src="animations.js"></script>
</body>
</html>
